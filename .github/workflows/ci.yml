name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/shortener/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: code/shortener/api/go.mod
          cache-dependency-path: code/shortener/api/go.sum

      - name: Check formatting (gofmt)
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "以下文件未能通过格式检查, 请先在本机执行 gofmt -w . 之后再提交: "
            echo "$files"
            exit 1
          fi
          echo "格式检查通过"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests (no external dependencies)
        run: go test ./internal/shortcode/... ./internal/httpapi/... ./internal/flusher/... -v

  frontend:
    name: Frontend (Vue + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code/shortener/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/shortener/web/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Production build
        run: npm run build

  integration:
    name: Integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/shortener/api
    
    services: 
      postgres:
        image: postgres:16-alpine
        env: 
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener_dev_password
          POSTGRES_DB: shortener
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
          PGDATA: /var/lib/postgresql/data/pgdata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 3
        
      redis: 
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: code/shortener/api/go.mod
          cache-dependency-path: code/shortener/api/go.sum
      
      - name: Integration Testing
        env: 
          TEST_DATABASE_URL: postgres://shortener:shortener_dev_password@localhost:5432/shortener?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test ./internal/store/... ./internal/cache/... -v
