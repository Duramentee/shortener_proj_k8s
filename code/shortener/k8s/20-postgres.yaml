apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: shortener
  labels:
    app.kubernetes.io/part-of: shortener
spec:
  clusterIP:
  selector:
    app:
  ports:
    - name: postgres
      port:
      targetPort:
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: shortener
  labels:
    app.kubernetes.io/part-of: shortener
spec:
  serviceName:
  replicas:
  selector:
    matchLabels:
      app:
  template:
    metadata:
      labels:
        app:
    spec:
      containers:
        - name: postgres
          image:
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort:
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB
            - name: POSTGRES_INITDB_ARGS
              valueFrom:
                configMapKeyRef:
                  name: api-config
                  key: POSTGRES_INITDB_ARGS
            - name: PGDATA
              value:
          volumeMounts:
            - name: data
              mountPath:
          readinessProbe:
            exec:
              command:
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu:
              memory:
            limits:
              cpu:
              memory:
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
        resources:
          requests:
            storage:
