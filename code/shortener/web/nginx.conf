# nginx 配置：既负责提供前端构建产物（静态文件），又负责把后端请求反向代理给 Go API 服务。
#
# 请求分流规则一共有三条，按 nginx 的匹配规则确认最终处理位置：
#   规则一：以 /api/ 开头的请求，全部代理给 Go API 的 8080 端口。
#   规则二：路径恰好是六位字母或数字的请求（例如 /a1B2c3），代理给 Go API 的 8080 端口，由后端返回 302 跳转。
#   规则三：其余请求一律返回 index.html，用于支持前端单页应用的路由。
#
# 关于 upstream 中的主机名 api：这个名字在 Docker Compose 中对应 services 下面名为 api 的服务，
# 在 Kubernetes 中对应同一个命名空间内名为 api 的 Service。也就是说，只要这两种部署方式都把后端命名为 api，
# 这一份配置文件不需要任何修改就可以同时用于阶段 3 与阶段 4。

upstream shortener_api {
    # keepalive 保持一定数量的空闲长连接，减少每次反向代理都重新建立连接的开销。
    server api:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 静态文件根目录，Dockerfile 会把 Vite 的构建产物 dist/ 复制到这里。
    root /usr/share/nginx/html;
    index index.html;

    # 关闭版本号输出，避免把 nginx 的具体版本暴露给外部。
    server_tokens off;

    # 打开文本类响应的压缩，减小页面与脚本的传输体积。
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 反向代理的公共响应头设置集中写在下面这一段，供两条代理规则通过 include 复用。
    # 说明：因为本项目的后端是 Go 的 net/http 标准库实现，它不解析 X-Forwarded-* 之外的代理头，
    # 所以这里只需要把客户端真实地址与协议传递过去，方便后端日志记录。

    # 规则一：应用接口。/api/ 这个前缀位置会命中下面的 location /api/。
    location /api/ {
        proxy_pass http://shortener_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与 upstream 中的 keepalive 配合使用时，连接头必须置空，否则长连接无法复用。
        proxy_set_header Connection "";

        # 关闭响应缓冲。nginx 的默认行为是先把上游返回的响应体完整接收下来，
        # 再一次性转发给客户端；关闭之后响应边接收边转发，因此在排查「接口响应慢」这类问题时，
        # 客户端能够更早收到第一个字节。本项目每个响应体的体积都很小，关闭缓冲不会带来额外的连接开销。
        proxy_buffering off;
    }

    # 静态资源目录使用前缀匹配并且加上 ^~ 修饰符，作用是命中之后不再继续尝试后面的正则位置规则。
    # 这一条是必要的，因为规则二的正则 ^/[A-Za-z0-9]{6}$ 恰好也能匹配 /assets 这六个字母，
    # 加上 ^~ 之后，形如 /assets/index-abc123.js 的请求会被这条前缀规则直接处理，不会再被转发给后端。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 上面那条前缀规则只覆盖带斜杠的 /assets/，路径恰好是 /assets 的请求需要单独处理，
    # 否则它会落进规则二并被当作短码转发给后端，从而出现 404。
    location = /assets {
        try_files /index.html =404;
    }

    # 规则二：六位短码跳转。~ 表示区分大小写的正则匹配，$ 表示路径在这六个字符之后立即结束。
    # proxy_pass 后面不带 URI 部分，nginx 会把客户端请求的原始路径原样传给后端，
    # 因此后端收到的路径就是 /a1B2c3，与接口契约中 GET /{code} 的定义一致。
    location ~ "^/[A-Za-z0-9]{6}$" {
        proxy_pass http://shortener_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关闭对 Location 响应头的重写。proxy_redirect 的默认行为是把上游返回的 Location
        # 中出现的上游地址替换成本服务对外暴露的地址；本项目后端返回的 302 响应里，
        # Location 字段存放的是用户提交的外部长网址，与上游服务地址没有任何关系，
        # 开启重写会让这条地址被错误地改写，因此必须显式设置为 off。
        proxy_redirect off;
    }

    # 规则三：其余路径全部回落给单页应用的入口文件，由前端自己处理路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
