# 本地联调使用的 Docker Compose 清单。
#
# 本文件的用途有两个阶段：
#   阶段 1（现在）：只启动 postgres 与 redis 两个依赖服务，后端在宿主机上用 go run 运行。
#   阶段 3（之后）：把 api 与 web 两个服务也加进来，四个组件一起运行，为第 4 阶段的 Kubernetes 清单提供对照。
#
# 与 Kubernetes 清单的对应关系（这份对照关系是你理解「Compose 与 K8s 的差异」的入口）：
#   compose 中的 services 与 k8s 中的 Deployment 或 StatefulSet 对应；
#   compose 中的 volumes 与 k8s 中的 PersistentVolumeClaim 对应；
#   compose 中的 environment 与 k8s 中的 ConfigMap 与 Secret 对应；
#   compose 中的 ports 与 k8s 中的 Service 对应；
#   compose 中的 healthcheck 与 k8s 中的探针对应；
#   compose 中的 depends_on 在 k8s 中没有等价的字段，因为 Kubernetes 依靠探针与重试来收敛，而不是依靠启动顺序。

services:
  postgres:
    image: postgres:16-alpine
    container_name: shortener-postgres
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener_dev_password
      POSTGRES_DB: shortener
      # 下面这一行让容器在初始化时使用与宿主机一致的排序规则，
      # 避免在不同机器上出现「排序结果不一致」这种难以排查的问题。
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # 宿主机端口 5432 映射到容器端口 5432，供阶段 1 与阶段 2 中的后端直接连接。
      - "5432:5432"
    volumes:
      # 具名卷，由 Docker 管理实际存放位置；这一步对应 Kubernetes 中的 VolumeClaimTemplates。
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # 使用 pg_isready 判断数据库是否已经可以接受连接。
      # 注意 -U 后面必须写成容器内部能够识别的用户名，而不是宿主机的用户名。
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shortener-redis
    command:
      # appendonly yes 打开 AOF 持久化，使容器重启之后缓存键仍然存在。
      # 对缓存而言这一步并非必须，加上它的目的是让阶段 6 的排障实验有一条确定的基线。
      - redis-server
      - --appendonly
      - "yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    # 构建上下文指向 api 目录，Dockerfile 就在该目录中。
    build:
      context: ./api
    container_name: shortener-api
    environment:
      # 服务名 postgres 与 redis 由 Compose 的内置 DNS 解析成对应容器的地址，
      # 因此这两个取值与在宿主机上运行时使用的 localhost 不同。
      DATABASE_URL: postgres://shortener:shortener_dev_password@postgres:5432/shortener?sslmode=disable
      REDIS_ADDR: redis:6379
      # 容器中关闭 gin 的 debug 模式，避免每个请求都往标准输出写调试信息。
      GIN_MODE: release
    # 不在 ports 中发布 8080 端口，因此后端只在 Compose 网络内部可达，
    # 外部流量只能经过 web 容器中的 nginx 进入，这与 Kubernetes 中后端只提供 ClusterIP 的安排一致。
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 使用就绪检查端点作为健康检查，它同时验证 PostgreSQL 与 Redis 是否可用。
      # 注意健康检查用的是容器内部的地址，不能写成宿主机的 localhost:8080。
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: ./web
    container_name: shortener-web
    ports:
      # 浏览器通过宿主机的 8080 端口访问前端页面，
      # 前端再由 nginx 根据 upstream 中的 api:8080 把请求反向代理给后端。
      - "8080:80"
    depends_on:
      api:
        # 等后端通过健康检查之后再启动前端，避免启动阶段 nginx 解析不到上游主机名。
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
